
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 500"
     fill="none">

  <defs>
    <linearGradient id="purple" x1="100" y1="100" x2="260" y2="350">
      <stop stop-color="#E879F9"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="cyan" x1="250" y1="150" x2="400" y2="350">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>

    <linearGradient id="orbit" x1="50" y1="250" x2="450" y2="250">
      <stop stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital ring -->
  <g class="logo-orbit" filter="url(#glow)">
    <ellipse cx="250" cy="245" rx="190" ry="78"
             stroke="url(#orbit)" stroke-width="3"
             opacity="0.85"
             transform="rotate(-20 250 245)"/>
  </g>

  <!-- Purple P -->
  <g class="logo-p" filter="url(#glow)">
    <path d="M145 345 V145 H235
             Q295 145 295 205
             Q295 265 235 265
             H145"
          stroke="url(#purple)"
          stroke-width="25"
          stroke-linecap="square"
          stroke-linejoin="bevel"/>
  </g>

  <!-- Cyan C -->
  <g class="logo-c" filter="url(#glow)">
    <path d="M365 190
             Q340 155 300 155
             Q225 155 225 245
             Q225 335 300 335
             Q340 335 365 300"
          stroke="url(#cyan)"
          stroke-width="25"
          stroke-linecap="square"
          stroke-linejoin="bevel"/>
  </g>

  <!-- Pixel particles -->
  <g class="logo-pixels" filter="url(#glow)">
    <rect x="85" y="125" width="15" height="15" fill="#C084FC"/>
    <rect x="105" y="95" width="10" height="10" fill="#A855F7"/>
    <rect x="390" y="135" width="14" height="14" fill="#22D3EE"/>
    <rect x="410" y="170" width="9" height="9" fill="#67E8F9"/>
    <rect x="385" y="350" width="12" height="12" fill="#06B6D4"/>
    <rect x="110" y="370" width="10" height="10" fill="#C084FC"/>
  </g>

  <!-- Center light -->
  <circle cx="250" cy="245" r="5"
          fill="white" filter="url(#glow)"/>

</svg>
